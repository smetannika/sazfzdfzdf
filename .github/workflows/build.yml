name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repo structure
        run: ls -la && find . -maxdepth 3 \( -name gradlew -o -name build.gradle -o -name build.gradle.kts \) -not -path "./.git/*"

      - name: Find project folder
        id: p
        run: |
          G=$(find . -name gradlew -not -path "./.git/*" | head -n1)
          if [ -z "$G" ]; then echo "gradlew not found"; exit 1; fi
          echo "dir=$(dirname "$G")" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build
        working-directory: ${{ steps.p.outputs.dir }}
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: client-jar
          path: ${{ steps.p.outputs.dir }}/build/libs/*.jar
